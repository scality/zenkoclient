---
name: tests

on:
  push:
    branches-ignore:
      - "development/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: install dependencies
        run: npm ci
      - name: build
        run: npm run build
